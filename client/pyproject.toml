[project]
name = "deeplabel-client"
version = "0.1.0"
license = "Apache-2.0"
authors = [{ name = "David Fleischhacker" }]
description = "Python client and CLI for a DeepLabel deployment"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deeplabel = "deeplabel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deeplabel"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
