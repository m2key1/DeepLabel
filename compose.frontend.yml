services:
  auth:
    build: ./auth
    container_name: deeplabel-auth
    restart: unless-stopped
    environment:
      AUTH_DATA_DIR: /data
      DEV_AUTH: ${DEV_AUTH:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      INITIAL_ADMIN_SUBJECT: ${INITIAL_ADMIN_SUBJECT:-}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-change-me}
      SESSION_COOKIE: ${SESSION_COOKIE:-sid}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    volumes:
      - ${AUTH_DATA_DIR:-./data/auth}:/data
    extra_hosts:
      - "localhost:host-gateway"

  frontend:
    build: ./frontend
    container_name: deeplabel-frontend
    restart: unless-stopped
    depends_on:
      - auth
    environment:
      AUTH_URL: http://auth:8000
      BACKEND_URL: ${BACKEND_URL:?set BACKEND_URL in .env}
      FRONTEND_SECRET: ${FRONTEND_SECRET:?set FRONTEND_SECRET in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-8080}:80"