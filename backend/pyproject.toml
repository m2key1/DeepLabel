[project]
name = "deeplabel-backend"
version = "0.1.0"
license = "Apache-2.0"
authors = [{ name = "David Fleischhacker" }]
description = "Web frontend + phased batch runner for the Schematismus extraction pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pillow>=10",
    "python-dotenv>=1.2.2",
    # LLM pre-annotation: HTTP to OpenAI-compatible endpoints, and the Fernet box that
    # keeps their API keys encrypted at rest in app.db.
    "httpx>=0.28",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pytest>=8",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
