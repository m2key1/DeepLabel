# A throwaway Authentik for the contract tests in test_contract.py. Nothing in it is kept:
#   docker compose -f auth/tests/authentik/compose.yml up -d
#   AUTHENTIK_CONTRACT_URL=http://127.0.0.1:9300 uv run --group dev pytest tests/authentik
#   docker compose -f auth/tests/authentik/compose.yml down -v
# The tag is the one compose.authentik.yml runs; bump both together.
name: deeplabel-authentik-contract
x-env: &env
  AUTHENTIK_SECRET_KEY: contract-secret-key-not-for-use-anywhere-0123456789
  AUTHENTIK_REDIS__HOST: redis
  AUTHENTIK_POSTGRESQL__HOST: db
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: contractpw
  AUTHENTIK_BOOTSTRAP_PASSWORD: contract-admin-pw
  AUTHENTIK_BOOTSTRAP_TOKEN: contract-bootstrap-token
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
services:
  db:
    image: postgres:18-alpine
    environment: {POSTGRES_DB: authentik, POSTGRES_USER: authentik, POSTGRES_PASSWORD: contractpw}
    volumes: [db:/var/lib/postgresql]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"], interval: 5s, retries: 20}
  redis:
    image: redis:8-alpine
    healthcheck: {test: ["CMD-SHELL", "redis-cli ping | grep PONG"], interval: 5s, retries: 20}
  server:
    image: ghcr.io/goauthentik/server:2026.2
    command: server
    environment: *env
    ports: ["127.0.0.1:9300:9000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  worker:
    image: ghcr.io/goauthentik/server:2026.2
    command: worker
    environment: *env
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
volumes: {db: {}}
