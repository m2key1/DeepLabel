name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a dataset ...
        2. ...
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown under the tabs of your profile, e.g. DeepLabel 0.1.0 · a1b2c3d
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
